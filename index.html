<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>免許クイズサイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>免許クイズサイト</h1>

    <div id="menu">
        <button id="startButton">普通免許仮免</button>
    </div>

    <div id="quizArea">
        <div id="progress"></div>

        <div id="question"></div>

        <div class="answer-buttons">
            <button class="answer-btn maru" id="maruBtn">〇</button>
            <button class="answer-btn batu" id="batuBtn">✕</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
