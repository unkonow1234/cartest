    <h1>普通自動車免許　本免・仮免学科試験　模擬練習サイト</h1>

    <p id="description">
        本サイトは、普通自動車免許の<strong>仮免許学科試験</strong>および<strong>本免許学科試験</strong>の対策ができる無料の学習サイトです。<br><br>

        <strong>練習モード</strong>では、収録されている問題の中からランダムに10問が出題されます。短時間で学習したい方や、スキマ時間の復習におすすめです。<br><br>

        <strong>模擬試験モード</strong>では、実際の学科試験と同じ合格基準で採点され、不合格が確定した時点で試験が自動的に終了します。本番に近い感覚で学習できます。
    </p>

    <div id="menu">

        <button id="startButton">
            仮免学科　練習
        </button>

        <button id="mockButton">
            仮免学科　模擬試験
        </button>

        <button id="honStartButton">
            普通本免　練習
        </button>

        <button id="honMockButton">
            本免学科　模擬試験
        </button>

    </div>

    <div id="quizArea" style="display:none;">

        <div id="progress"></div>

        <div id="question"></div>

        <div class="answer-buttons">

            <button class="answer-btn maru" id="maruBtn">
                〇
            </button>

            <button class="answer-btn batu" id="batuBtn">
                ✕
            </button>

        </div>

        <div id="result"></div>

    </div>
